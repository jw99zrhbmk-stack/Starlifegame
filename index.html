<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>StarLife — Anime Life Open World</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101e;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}#game{position:fixed;inset:0;background:linear-gradient(#152a46,#07101e)}canvas{position:absolute;inset:0;width:100%;height:100%}#start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(66,133,255,.25),rgba(4,8,18,.94) 60%)}.card{width:min(88vw,560px);padding:30px;border-radius:26px;text-align:center;background:rgba(7,16,30,.82);border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 80px rgba(0,0,0,.5);backdrop-filter:blur(16px)}h1{font-size:clamp(38px,8vw,72px);margin:0 0 6px;background:linear-gradient(90deg,#fff,#9fd4ff,#e6c7ff);-webkit-background-clip:text;color:transparent}p{opacity:.8}.start{margin-top:20px;padding:16px 30px;border:0;border-radius:16px;font-weight:800;font-size:18px;cursor:pointer;background:#fff;color:#07101e}.ui{position:fixed;z-index:10;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.pill{padding:9px 12px;border-radius:14px;background:rgba(4,10,22,.7);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);font-size:12px}.controls{position:fixed;z-index:11;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px}.btn{pointer-events:auto;border:1px solid rgba(255,255,255,.2);background:rgba(7,16,30,.72);color:white;border-radius:14px;padding:12px 16px;font-weight:700}.hint{position:fixed;z-index:10;left:50%;bottom:72px;transform:translateX(-50%);font-size:12px;opacity:.75;white-space:nowrap}</style></head><body><div id="game"><canvas id="c"></canvas></div><div class="ui"><div class="pill">⭐ STARLIFE • OPEN WORLD</div><div class="pill" id="loc">Starlight City</div></div><div class="hint">Move with WASD / arrows • Explore the city</div><div class="controls"><button class="btn" onclick="move(0,-1)">▲</button><button class="btn" onclick="move(-1,0)">◀</button><button class="btn" onclick="move(1,0)">▶</button><button class="btn" onclick="move(0,1)">▼</button></div><div id="start"><div class="card"><h1>StarLife</h1><p>Your anime life adventure begins here.</p><p>Explore • Meet people • Study • Work • Love • Build your life</p><button class="start" id="enter">ENTER YOUR LIFE</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H,px=.5,py=.55,started=false;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function draw(){const w=innerWidth,h=innerHeight;x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#8fc8ee');g.addColorStop(.5,'#dce9e5');g.addColorStop(1,'#8dbf8a');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#87a66f';x.fillRect(0,h*.62,w,h*.38);for(let i=0;i<16;i++){let bx=(i*137)%w,by=h*.45+(i*53)%h*.22;x.fillStyle=i%3?'#b8b6b0':'#d7c9bc';x.fillRect(bx,by,90+(i%4)*35,150+(i%5)*35);x.fillStyle='#53687c';x.fillRect(bx+12,by+18,25,35);x.fillRect(bx+48,by+18,25,35)}x.fillStyle='#d8c7ad';x.fillRect(0,h*.72,w,h*.12);x.fillStyle='#8b8b91';x.fillRect(0,h*.755,w,h*.035);let cx=w*px,cy=h*py;x.beginPath();x.arc(cx,cy,18,0,Math.PI*2);x.fillStyle='#f7c7b1';x.fill();x.fillStyle='#5d3d34';x.beginPath();x.arc(cx,cy-8,18,Math.PI,Math.PI*2);x.fill();x.fillStyle='#5d84d8';x.fillRect(cx-13,cy+18,26,38);x.fillStyle='#222';x.fillRect(cx-12,cy+56,9,25);x.fillRect(cx+3,cy+56,9,25)}function move(dx,dy){if(!started)return;px=Math.max(.08,Math.min(.92,px+dx*.035));py=Math.max(.18,Math.min(.9,py+dy*.035));draw()}document.getElementById('enter').addEventListener('click',()=>{started=true;document.getElementById('start').style.display='none';draw()});addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')move(0,-1);if(e.key==='ArrowDown'||e.key==='s')move(0,1);if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);if(e.key==='ArrowRight'||e.key==='d')move(1,0)});draw();</script></body></html>
