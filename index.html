<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>StarLife</title><style>*{box-sizing:border-box}body{margin:0;background:#06101e;color:#fff;font:14px system-ui;overflow:hidden}#app{height:100vh;display:flex;flex-direction:column;background:linear-gradient(#172a55,#08101d)}header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#091326dd;z-index:4}.logo{font-weight:900;font-size:22px}.stats{font-size:12px;text-align:right}.world{position:relative;flex:1;overflow:hidden}.scene{position:absolute;inset:0;background:linear-gradient(#75a8df 0 45%,#d8b8a0 45% 52%,#506b62 52%);overflow:hidden}.sun{position:absolute;width:110px;height:110px;border-radius:50%;background:#fff2c4;right:12%;top:10%;box-shadow:0 0 55px #fff4}.castle{position:absolute;bottom:29%;left:8%;width:84%;height:38%;background:#e8e0d6;clip-path:polygon(0 100%,0 55%,8% 55%,8% 25%,15% 25%,15% 45%,25% 45%,25% 10%,32% 10%,32% 40%,43% 40%,43% 18%,51% 18%,51% 45%,62% 45%,62% 5%,70% 5%,70% 38%,82% 38%,82% 20%,90% 20%,90% 55%,100% 55%,100% 100%);box-shadow:0 12px 30px #17233c}.road{position:absolute;bottom:0;left:0;right:0;height:34%;background:linear-gradient(105deg,#303b4b,#687586,#303b4b)}.lamp{position:absolute;bottom:28%;width:5px;height:150px;background:#202b3b}.lamp:after{content:'✦';position:absolute;top:-28px;left:-9px;font-size:22px;color:#ffe9a5}.l1{left:15%}.l2{right:18%}.hero{position:absolute;bottom:17%;left:48%;font-size:72px;filter:drop-shadow(0 8px 5px #111);transition:.15s}.hero:after{content:'You';display:block;font-size:11px;text-align:center;background:#091326cc;border-radius:10px;padding:2px 6px;margin-top:-12px}.npc{position:absolute;bottom:20%;font-size:50px;filter:drop-shadow(0 6px 4px #111)}.n1{left:25%}.n2{right:27%}.panel{position:absolute;top:14px;left:14px;width:210px;background:#091326d9;border:1px solid #8ba6d955;border-radius:14px;padding:12px;backdrop-filter:blur(8px)}button{border:1px solid #9db8e066;background:#142747;color:#fff;border-radius:10px;padding:9px;margin:3px;cursor:pointer}button:active{transform:scale(.97)}.actions{position:absolute;right:12px;bottom:80px;width:150px;background:#091326d9;border-radius:14px;padding:8px}.actions button{width:100%}.bottom{height:66px;background:#07101f;display:flex;justify-content:space-around;align-items:center;z-index:5}.bottom button{min-width:62px;background:#11213b}.modal{position:absolute;inset:0;background:#030812dd;z-index:9;display:flex;align-items:center;justify-content:center}.card{width:min(92%,520px);background:#101d34;border:1px solid #7896c966;border-radius:18px;padding:20px;box-shadow:0 20px 60px #000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}input,select{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:0;background:#eaf0fa}.hide{display:none}.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#091326ee;padding:9px 14px;border-radius:20px;z-index:10}</style></head><body><div id=app><header><div class=logo>⭐ StarLife</div><div class=stats>Year <b id=age>18</b> · 💰 <b id=money>2500</b><br><span id=season>Spring</span> · <span id=place>Starfall City</span></div></header><div class=world><div class=scene><div class=sun></div><div class=castle></div><div class="lamp l1"></div><div class="lamp l2"></div><div class="npc n1">🧑🏻‍🎤</div><div class="npc n2">👩🏻‍🎨</div><div class=hero id=hero>🧙🏻‍♀️</div><div class=road></div></div><div class=panel><b id=title>Starfall City</b><div id=desc>Explore your world and shape your life.</div><hr><div>❤️ <span id=health>100</span> · 😊 <span id=happ>70</span></div><div>🎓 <span id=edu>High School</span></div><div>💼 <span id=job>Student</span></div><div>💞 <span id=rel>Single</span></div></div><div class=actions><button onclick=act('talk')>💬 Talk</button><button onclick=act('work')>💼 Work</button><button onclick=act('study')>📚 Study</button><button onclick=act('date')>💖 Date</button><button onclick=act('travel')>✈️ Travel</button><button onclick=act('home')>🏠 Home</button></div></div><div class=bottom><button onclick=show('life')>Life</button><button onclick=show('world')>World</button><button onclick=show('people')>People</button><button onclick=show('career')>Career</button><button onclick=show('more')>More</button></div></div><div id=modal class="modal"><div class=card id=card></div></div><div id=toast class="toast hide"></div><script>let S={name:'Avery',age:18,money:2500,health:100,happ:70,edu:'High School',job:'Student',rel:'Single',loc:'Starfall City',pet:false,car:false,married:false,kids:0};const $=x=>document.getElementById(x);function sync(){['age','money','health','happ','edu','job','rel','place'].forEach(k=>$(k)&&( $(k).textContent=S[k]||S.loc));$('title').textContent=S.loc}function toast(x){$('toast').textContent=x;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),1800)}function act(a){let m={talk:['You had a warm conversation.','happ',5],work:['You earned money from work.','money',250],study:['You studied hard.','happ',3],date:['A sweet date brought you closer.','happ',8],travel:['You discovered a beautiful new place.','happ',12],home:['You rested at home.','health',8]}[a];if(!m)return;S[m[1]]+=m[2];sync();toast(m[0])}function ageUp(){S.age++;S.happ=Math.max(0,S.happ-3);S.health=Math.max(0,S.health-2);if(S.age==19)S.edu='College';if(S.age==22)S.job='Junior Designer';sync();toast('You grew older. A new chapter begins!')}function move(x){$('hero').style.left=Math.max(4,Math.min(88,x))+'%'}document.addEventListener('keydown',e=>{let x=parseFloat($('hero').style.left)||48;if(e.key==='ArrowLeft'||e.key==='a')move(x-2);if(e.key==='ArrowRight'||e.key==='d')move(x+2);if(e.key==='ArrowUp'||e.key==='w')move(x);if(e.key===' ')ageUp()});function close(){ $('modal').classList.add('hide')}function show(t){let h={life:`<h2>📖 Your Life</h2><p><b>${S.name}</b>, age ${S.age}. You are ${S.job}. Happiness ${S.happ}/100.</p><button onclick=ageUp()>🎂 Age Up</button><button onclick=act('home')>😴 Rest</button>`,world:`<h2>🗺️ World</h2><div class=grid>${['Starfall City','High School','Café','Beach','Night Life','Hospital','Gym','Mall','Your House'].map(x=>`<button onclick="S.loc='${x}';sync();close()">${x}</button>`).join('')}</div>`,people:`<h2>💞 People</h2><p>🧑🏻‍🎤 Ren — Friend</p><p>👩🏻‍🎨 Aiko — Relationship ${S.rel}</p><button onclick="act('talk');close()">Talk</button><button onclick="S.rel='Dating';sync();close();toast('You are now dating!')">Date</button>`,career:`<h2>💼 Careers</h2><button onclick="S.job='Designer';sync();close()">Designer</button><button onclick="S.job='Developer';sync();close()">Developer</button><button onclick="S.job='Doctor';sync();close()">Doctor</button><button onclick="S.job='Artist';sync();close()">Artist</button>`,more:`<h2>✨ More Life</h2><button onclick="S.car=true;S.money-=1200;sync();toast('New car!');close()">🚗 Buy Car $1200</button><button onclick="S.pet=true;sync();toast('You adopted a pet!');close()">🐾 Adopt Pet</button><button onclick="S.married=true;S.rel='Married';sync();toast('Congratulations!');close()">💍 Get Married</button><button onclick="S.kids++;sync();toast('Your family grew!');close()">👶 Have Child</button><button onclick="act('travel');close()">✈️ Travel</button></div>`};$('card').innerHTML=h[t]+`<br><button onclick=close()>Close</button>`;$('modal').classList.remove('hide')}$('modal').classList.add('hide');sync();let sx=null;document.querySelector('.world').addEventListener('touchstart',e=>sx=e.touches[0].clientX);document.querySelector('.world').addEventListener('touchmove',e=>{if(sx!=null){let dx=e.touches[0].clientX-sx;move((parseFloat($('hero').style.left)||48)+dx*.08);sx=e.touches[0].clientX}});document.querySelector('.world').addEventListener('touchend',()=>sx=null)</script></body></html>
