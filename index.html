<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>StarLife — Your Story. Your World.</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101f;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{color:#fff;background:#122747;border:1px solid #8da8d966;border-radius:12px;padding:10px 13px;box-shadow:0 5px 18px #0005}button:active{transform:scale(.97)}#app{height:100%;display:flex;flex-direction:column;background:#07101f}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:7px 18px;background:#071326ee;border-bottom:1px solid #7894c733;z-index:5}.logo{font-size:24px;font-weight:900}.tag{font-size:11px;opacity:.65}.stats{text-align:right;font-size:12px;line-height:1.35}.world{position:relative;flex:1;min-height:0;overflow:hidden}.scene{position:absolute;inset:0;background:#18365d}.scene svg{width:100%;height:100%;display:block}.hud{position:absolute;left:16px;top:16px;width:250px;background:#071426d9;border:1px solid #b2c9ec55;border-radius:18px;padding:13px;backdrop-filter:blur(10px);z-index:3;box-shadow:0 16px 35px #0005}.hud h3{margin:0 0 5px}.small{font-size:12px;opacity:.8}.bar{height:7px;background:#ffffff18;border-radius:10px;overflow:hidden;margin:5px 0 7px}.bar i{display:block;height:100%;width:70%;background:linear-gradient(90deg,#f46b91,#ffd166);border-radius:10px}.actions{position:absolute;right:15px;bottom:15px;width:175px;padding:8px;background:#071426dd;border:1px solid #b2c9ec44;border-radius:18px;z-index:3}.actions button{width:100%;margin:3px 0}.nav{height:72px;background:#07101feF;border-top:1px solid #7894c733;display:flex;align-items:center;justify-content:space-around;z-index:6}.nav button{min-width:70px;padding:8px;background:#10213a}.player{position:absolute;left:50%;bottom:19%;width:58px;height:105px;transform:translateX(-50%);z-index:2;transition:.08s}.player .hair{position:absolute;top:0;left:9px;width:40px;height:48px;background:#202a45;border-radius:50% 50% 42% 42%;box-shadow:0 5px 0 #1119}.player .face{position:absolute;top:14px;left:16px;width:27px;height:30px;border-radius:45%;background:#f2c7a6}.player .eye{position:absolute;top:26px;width:4px;height:5px;background:#1b2235;border-radius:50%}.player .e1{left:21px}.player .e2{left:34px}.player .body{position:absolute;top:46px;left:9px;width:40px;height:52px;background:#6d5ce7;border-radius:16px 16px 8px 8px}.player .leg{position:absolute;top:91px;width:13px;height:22px;background:#202a45;border-radius:8px}.player .l1{left:13px}.player .l2{left:33px}.player .label{position:absolute;top:108px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#071426cc;padding:2px 8px;border-radius:10px;font-size:10px}.npc{position:absolute;z-index:2;width:48px;height:88px;bottom:20%}.npc .nhead{position:absolute;top:0;left:10px;width:30px;height:34px;background:#f0c2a0;border-radius:50%}.npc .nhair{position:absolute;top:-3px;left:6px;width:38px;height:34px;background:#b84e74;border-radius:50% 50% 35% 35%}.npc .nbody{position:absolute;top:33px;left:5px;width:38px;height:49px;background:#efb4d3;border-radius:14px}.n1{left:27%}.n2{right:25%}.panel{position:absolute;inset:0;background:#030813dc;z-index:10;display:flex;align-items:center;justify-content:center}.card{width:min(92%,650px);max-height:86%;overflow:auto;background:#0d1b32;border:1px solid #9eb8df66;border-radius:22px;padding:20px;box-shadow:0 25px 80px #000b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{min-height:48px}.close{float:right}.hidden{display:none}.toast{position:absolute;top:78px;left:50%;transform:translateX(-50%);z-index:20;background:#071426f5;border:1px solid #9eb8df55;padding:9px 16px;border-radius:20px}.cmd{position:absolute;left:50%;bottom:94px;transform:translateX(-50%);width:min(540px,58%);z-index:4;display:flex;gap:6px}.cmd input{flex:1;min-width:0;padding:11px 14px;border-radius:16px;border:1px solid #9eb8df55;background:#071426e8;color:white;outline:none}.pill{display:inline-block;padding:4px 8px;border-radius:10px;background:#ffffff10;margin:2px;font-size:11px}@media(max-width:700px){.hud{width:210px;font-size:12px}.actions{width:135px}.cmd{width:55%;bottom:84px}.nav{height:64px}.nav button{min-width:54px;padding:7px 5px;font-size:11px}.logo{font-size:20px}}</style></head><body><div id="app"><header class="top"><div><div class="logo">⭐ StarLife</div><div class="tag">Your Story. Your World.</div></div><div class="stats">Year <b id="age">18</b> · 💰 <b id="money">2500</b><br><span>Spring</span> · <span id="place">Starfall City</span></div></header><main class="world"><div class="scene" id="scene"></div><div class="hud"><h3 id="title">Starfall City</h3><div class="small" id="desc">A living anime-inspired world awaits you.</div><hr><div>❤️ Health <b id="health">100</b></div><div class="bar"><i id="hb"></i></div><div>😊 Happiness <b id="happy">70</b></div><div class="bar"><i id="mb"></i></div><div>🎓 <span id="edu">High School</span> · 💼 <span id="job">Student</span></div><div>💞 <span id="rel">Single</span> · 👶 <span id="kids">0</span> children</div><div class="pill" id="pet">🐾 No pet</div><div class="pill" id="car">🚗 No car</div></div><div class="npc n1"><div class="nhair"></div><div class="nhead"></div><div class="nbody"></div></div><div class="npc n2"><div class="nhair" style="background:#5b76c9"></div><div class="nhead"></div><div class="nbody" style="background:#91d7e9"></div></div><div class="player" id="player"><div class="hair"></div><div class="face"></div><div class="eye e1"></div><div class="eye e2"></div><div class="body"></div><div class="leg l1"></div><div class="leg l2"></div><div class="label" id="playerLabel">Avery</div></div><div class="actions"><button onclick="doAct('talk')">💬 Talk</button><button onclick="doAct('work')">💼 Work</button><button onclick="doAct('study')">📚 Study</button><button onclick="doAct('date')">💖 Date</button><button onclick="doAct('travel')">✈️ Travel</button><button onclick="doAct('rest')">🏠 Rest</button></div><div class="cmd"><input id="command" placeholder="Try: go to café · get a job · adopt a pet"><button onclick="command()">Go</button></div></main><nav class="nav"><button onclick="openPanel('life')">📖 Life</button><button onclick="openPanel('world')">🗺️ World</button><button onclick="openPanel('people')">💞 People</button><button onclick="openPanel('career')">💼 Career</button><button onclick="openPanel('more')">✨ More</button></nav><div class="panel hidden" id="panel"><div class="card" id="card"></div></div><div class="toast hidden" id="toast"></div></div><script>const S={name:'Avery',age:18,money:2500,health:100,happy:70,edu:'High School',job:'Student',rel:'Single',kids:0,pet:false,car:false,married:false,wanted:0,loc:'Starfall City',x:50};const scenes={'Starfall City':['#5e91d1','#34495f','#d9d0c5','The heart of Starfall City — towers, gardens and a huge life ahead.'],'High School':['#88b7e8','#496879','#e9d6c6','Classes, clubs, friendships and the first steps toward college.'],'Café':['#2d2030','#8b5e55','#d99b6e','A warm evening café where friendships and romance can begin.'],'Beach':['#72bde0','#d8c28d','#fff0cf','Sun, waves and a place to clear your mind.'],'Your House':['#9c7db5','#443a53','#cfae8a','Your private space to rest, decorate and build a family.'],'Night Life':['#18152f','#24203e','#e65a9b','Neon streets, music, parties and unexpected encounters.'],'Hospital':['#d9edf7','#71889b','#f7f7f7','Medical care, recovery and health choices.'],'Gym':['#405267','#252c38','#b7c7d8','Train your body and strengthen your mental health.'],'Work':['#647b9a','#344254','#d9e3ed','Build your career, earn money and shape your future.'],'Mall':['#a8c3dc','#505d70','#f4e5d1','Shopping, food, entertainment and social life.'],'Family':['#6f8f8b','#3f504f','#e5c49d','Spend time with the people who matter.'],'Pets':['#9ac7d5','#506e67','#efcf9e','Meet animals, adopt a companion and make memories.'],'Travel':['#718ed0','#3c526f','#f2d9a6','Leave the city and discover new places.'],'Hobbies':['#8c7db5','#403a55','#d4a7c6','Music, art, reading and hobbies improve your life.'],'Real Estate':['#7ca7c4','#56635c','#ead8bd','Find your dream home and grow your property.'],'Garage':['#697b91','#343d48','#d1b48d','Buy and maintain vehicles.'],'Legacy':['#202b4b','#111827','#e8c87a','Look back on your life and begin a new generation.'],'Police':['#53647b','#252c38','#cbd6e6','Consequences, investigations and the law.']};function $(x){return document.getElementById(x)}function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function sync(){['age','money','health','happy','edu','job','rel','kids'].forEach(k=>$(k).textContent=S[k]);$('place').textContent=S.loc;$('title').textContent=S.loc;$('desc').textContent=scenes[S.loc]?.[3]||'Explore your life.';$('hb').style.width=S.health+'%';$('mb').style.width=S.happy+'%';$('pet').textContent=S.pet?'🐾 Pet companion':'🐾 No pet';$('car').textContent=S.car?'🚗 Owns a car':'🚗 No car';$('playerLabel').textContent=S.name;renderScene()}function buildings(a){let o='';for(let i=0;i<9;i++){let x=i*140-30,h=150+(i%4)*50;o+=`<g><rect x="${x}" y="${470-h}" width="112" height="${h}" rx="5" fill="${a}" opacity=".${7+(i%2)}"/><polygon points="${x-8},${470-h} ${x+56},${430-h} ${x+120},${470-h}" fill="#ffffff22"/>${[0,1,2].map(r=>`<rect x="${x+18}" y="${470-h+28+r*32}" width="18" height="18" rx="3" fill="#b9d9ff88"/><rect x="${x+65}" y="${470-h+28+r*32}" width="18" height="18" rx="3" fill="#ffd98a88"/>`).join('')}</g>`}return o}function renderScene(){let q=scenes[S.loc]||scenes['Starfall City'];$('scene').innerHTML=`<svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="${q[0]}"/><stop offset="1" stop-color="#1b2945"/></linearGradient><linearGradient id="road"><stop stop-color="#202b3c"/><stop offset=".5" stop-color="#566579"/><stop offset="1" stop-color="#202b3c"/></linearGradient></defs><rect width="1200" height="700" fill="url(#sky)"/><circle cx="980" cy="125" r="58" fill="#fff1bc" opacity=".9"/><path d="M0 470 Q260 405 520 465T1200 450V700H0Z" fill="${q[1]}"/><path d="M0 575 L1200 520 L1200 700 L0 700Z" fill="url(#road)" opacity=".95"/>${buildings(q[2])}<path d="M90 545 Q600 485 1110 540" fill="none" stroke="#f7d989" stroke-width="5" stroke-dasharray="22 20" opacity=".6"/><text x="55" y="80" fill="#fff" opacity=".25" font-size="28" font-weight="700">${S.loc.toUpperCase()}</text></svg>`}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),1800)}function doAct(a){if(a==='talk'){S.happy=clamp(S.happy+5,0,100);toast('💬 A meaningful conversation lifted your mood.')}if(a==='work'){S.money+=250;S.happy=clamp(S.happy-2,0,100);toast('💼 You earned $250.')}if(a==='study'){S.happy=clamp(S.happy+3,0,100);toast('📚 Your skills improved.')}if(a==='date'){if(S.rel==='Single')S.rel='Dating';S.happy=clamp(S.happy+8,0,100);toast('💖 Your relationship is growing.')}if(a==='travel'){S.money=Math.max(0,S.money-150);S.loc='Travel';S.happy=clamp(S.happy+10,0,100);toast('✈️ You discovered somewhere new.')}if(a==='rest'){S.health=clamp(S.health+8,0,100);S.loc='Your House';toast('🏠 You rested and recovered.')}sync()}function move(dx,dy){S.x=clamp(S.x+dx,5,90);$('player').style.left=S.x+'%';$('player').style.bottom=clamp(19-dy,12,38)+'%'}document.addEventListener('keydown',e=>{if(['ArrowLeft','a'].includes(e.key))move(-2,0);if(['ArrowRight','d'].includes(e.key))move(2,0);if(['ArrowUp','w'].includes(e.key))move(0,2);if(['ArrowDown','s'].includes(e.key))move(0,-2);if(e.key===' ')ageUp()});let sx,sy;document.querySelector('.world').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.querySelector('.world').addEventListener('touchmove',e=>{if(sx==null)return;let t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>4||Math.abs(dy)>4){move(dx*.03,-dy*.015);sx=t.clientX;sy=t.clientY}},{passive:true});document.querySelector('.world').addEventListener('touchend',()=>{sx=sy=null});function ageUp(){S.age++;S.happy=clamp(S.happy-3,0,100);S.health=clamp(S.health-2,0,100);if(S.age===19)S.edu='College';if(S.age===22&&S.job==='Student')S.job='Junior Designer';sync();toast('🎂 A new year begins!')}const locations=Object.keys(scenes);function goLoc(x){S.loc=x;sync();close();toast('📍 Arrived at '+x)}function openPanel(t){let h='';if(t==='life')h=`<button class="close" onclick="close()">✕</button><h2>📖 Your Life</h2><p><b>${S.name}</b>, age ${S.age}. ${S.job}. You have $${S.money} and ${S.happy}/100 happiness.</p><p>Education: ${S.edu} · Relationship: ${S.rel} · Children: ${S.kids}</p><button onclick="ageUp();close()">🎂 Age Up</button>`;if(t==='world')h=`<button class="close" onclick="close()">✕</button><h2>🗺️ StarLife World</h2><div class="grid">${locations.map(x=>`<button onclick="goLoc('${x}')">${x}</button>`).join('')}</div>`;if(t==='people')h=`<button class="close" onclick="close()">✕</button><h2>💞 Relationships</h2><p>🌸 Aiko — close friend</p><p>🎧 Ren — friend</p><p>✨ Mina — classmate</p><button onclick="doAct('talk');close()">💬 Talk</button><button onclick="doAct('date');close()">💖 Date</button><button onclick="S.married=true;S.rel='Married';sync();close();toast('💍 You got married!')">💍 Get Married</button>`;if(t==='career')h=`<button class="close" onclick="close()">✕</button><h2>💼 Careers</h2><div class="grid">${['Designer','Developer','Doctor','Artist','Teacher','Entrepreneur'].map(x=>`<button onclick="S.job='${x}';sync();close();toast('💼 Career: ${x}')">${x}</button>`).join('')}</div>`;if(t==='more')h=`<button class="close" onclick="close()">✕</button><h2>✨ Life Systems</h2><div class="grid"><button onclick="S.car=true;S.money=Math.max(0,S.money-1200);sync();close();toast('🚗 New car!')">🚗 Buy Car</button><button onclick="S.pet=true;sync();close();toast('🐾 Pet adopted!')">🐾 Adopt Pet</button><button onclick="S.kids++;sync();close();toast('👶 Family grew!')">👶 Have Child</button><button onclick="S.wanted++;S.money+=500;sync();close();toast('🚨 Wanted level '+S.wanted)">🚨 Crime</button><button onclick="S.wanted=0;sync();close();toast('👮 Police matter resolved.')">👮 Police</button><button onclick="S.health=100;S.loc='Hospital';sync();close();toast('🏥 Health restored.')">🏥 Hospital</button><button onclick="goLoc('Hobbies')">🎨 Hobbies</button><button onclick="goLoc('Real Estate')">🏡 Real Estate</button></div>`;$('card').innerHTML=h;$('panel').classList.remove('hidden')}function close(){$('panel').classList.add('hidden')}function command(){let q=$('command').value.toLowerCase().trim();$('command').value='';if(!q)return;if(q.includes('cafe')||q.includes('café'))goLoc('Café');else if(q.includes('school'))goLoc('High School');else if(q.includes('beach'))goLoc('Beach');else if(q.includes('hospital')||q.includes('doctor'))goLoc('Hospital');else if(q.includes('gym'))goLoc('Gym');else if(q.includes('house')||q.includes('home'))goLoc('Your House');else if(q.includes('night'))goLoc('Night Life');else if(q.includes('work')||q.includes('job')){goLoc('Work');S.job=S.job==='Student'?'Designer':S.job;S.money+=200;sync();toast('💼 You worked a shift.')}else if(q.includes('pet')||q.includes('adopt')){S.pet=true;sync();toast('🐾 You adopted a pet!')}else if(q.includes('car')){S.car=true;S.money=Math.max(0,S.money-1200);sync();toast('🚗 You bought a car.')}else if(q.includes('marry')){S.married=true;S.rel='Married';sync();toast('💍 Congratulations!')}else if(q.includes('child')||q.includes('baby')){S.kids++;sync();toast('👶 Your family grew!')}else if(q.includes('travel'))goLoc('Travel');else if(q.includes('crime')){S.wanted++;S.money+=500;sync();toast('🚨 Wanted level '+S.wanted)}else if(q.includes('age'))ageUp();else toast('✨ Try: school, café, work, date, pet, car, travel, crime, house')}function start(){let n=prompt('Create your character — name:','Avery');if(n){S.name=n.trim()||'Avery';let hair=prompt('Choose hair: Dark, Silver, or Blue','Dark')||'Dark';$('player').querySelector('.hair').style.background=hair.toLowerCase().includes('silver')?'#c8d0df':hair.toLowerCase().includes('blue')?'#4169b7':'#202a45';sync();toast('✨ Welcome to StarLife, '+S.name+'!')}}sync();setTimeout(start,400)</script></body></html>
