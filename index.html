<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>StarLife — Your Story. Your World.</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;color:#fff;font-family:system-ui,-apple-system,sans-serif}button{border:0;border-radius:12px;padding:10px 13px;background:#20365f;color:white;font-weight:700}button:active{transform:scale(.97)}#app{height:100%;display:flex;flex-direction:column;background:#081221}header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:7px 14px;background:#081326ee;z-index:5}.logo{font-size:21px;font-weight:900}.tag{font-size:10px;opacity:.7}.stats{text-align:right;font-size:12px}.world{position:relative;flex:1;overflow:hidden}.scene{position:absolute;inset:0;overflow:hidden;background:#182d4c}.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#07111d22 0,#07111d00 45%,#07111daa 100%)}.player{position:absolute;left:48%;top:58%;width:58px;height:92px;transform:translate(-50%,-50%);z-index:3;transition:left .12s,top .12s;filter:drop-shadow(0 8px 6px #0008)}.head{width:38px;height:38px;border-radius:50%;background:#ffd4b8;border:3px solid #fff;margin:auto;position:relative}.head:before{content:'';position:absolute;left:-3px;top:-8px;width:38px;height:20px;border-radius:50% 50% 30% 30%;background:var(--hair,#18263c)}.body{width:46px;height:48px;margin:-1px auto 0;border-radius:16px 16px 8px 8px;background:linear-gradient(135deg,#8ea9ff,#573a9d);border:2px solid #ffffff88}.label{text-align:center;font-size:10px;background:#07111dcc;border-radius:8px;padding:2px 5px;margin-top:2px}.npc{position:absolute;z-index:2;width:46px;height:75px;filter:drop-shadow(0 7px 5px #0008)}.npc .head{width:31px;height:31px}.npc .body{width:37px;height:39px}.n1{left:25%;top:52%}.n2{left:70%;top:48%}.hud{position:absolute;left:12px;top:12px;width:220px;background:#071326d9;border:1px solid #9bb9ee44;border-radius:16px;padding:12px;backdrop-filter:blur(8px);z-index:4}.hud h3{margin:0 0 5px}.bar{height:7px;background:#ffffff22;border-radius:8px;overflow:hidden;margin:4px 0 7px}.fill{height:100%;background:#8fc7ff}.quest{position:absolute;right:12px;top:12px;width:210px;background:#071326d9;border-radius:16px;padding:12px;z-index:4}.actions{position:absolute;right:12px;bottom:15px;width:155px;background:#071326dd;border-radius:16px;padding:7px;z-index:4}.actions button{width:100%;margin:3px 0}.bottom{height:68px;display:flex;align-items:center;justify-content:space-around;background:#06101e;border-top:1px solid #ffffff12;z-index:5}.bottom button{background:#112443;min-width:62px}.modal{position:absolute;inset:0;background:#020711dd;z-index:10;display:flex;align-items:center;justify-content:center}.card{width:min(94%,620px);max-height:88vh;overflow:auto;background:#0e1b32;border:1px solid #9bb9ee55;border-radius:20px;padding:20px;box-shadow:0 20px 70px #000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.grid button{min-height:48px}.close{float:right;background:#ffffff18}.toast{position:absolute;top:72px;left:50%;transform:translateX(-50%);background:#071326ee;padding:10px 16px;border-radius:20px;z-index:20}.hide{display:none}.field{width:100%;padding:12px;border:0;border-radius:10px;margin:5px 0;background:#edf3ff}.choice{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.choice button.sel{outline:2px solid #fff}.small{font-size:12px;opacity:.8}.money{font-size:16px;font-weight:800}@media(max-width:700px){.hud{width:190px}.quest{width:175px}.actions{width:135px}.grid{grid-template-columns:repeat(2,1fr)}.quest{top:auto;bottom:14px;right:155px}.actions{bottom:14px}}</style></head><body><div id=app><header><div><div class=logo>⭐ StarLife</div><div class=tag>Your Story. Your World.</div></div><div class=stats>Year <b id=age>18</b> · <span class=money>💰 $<b id=money>2500</b></span><br><span id=time>Morning</span> · <span id=season>Spring</span></div></header><div class=world id=world><div class=scene id=scene></div><div class=hud><h3 id=loc>Starfall City</h3><div class=small id=desc>Explore your world and shape your life.</div><div>❤️ Health <b id=health>100</b></div><div class=bar><div class=fill id=hf style="width:100%"></div></div><div>😊 Happiness <b id=happ>70</b></div><div class=bar><div class=fill id=pf style="width:70%"></div></div><div>🎓 <span id=edu>High School</span> · 💼 <span id=job>Student</span></div><div>💞 <span id=rel>Single</span></div></div><div class=quest><b>✦ Current Life</b><div id=quest>Meet someone new and explore the city.</div><div class=small>Use the buttons or type a command below.</div></div><div class=npc n1><div class=head></div><div class=body></div><div class=label>Ren</div></div><div class=npc n2><div class=head></div><div class=body style="background:linear-gradient(135deg,#ff9ab4,#713e91)"></div><div class=label>Aiko</div></div><div class=player id=player><div class=head id=ph></div><div class=body></div><div class=label id=pname>You</div></div><div class=actions><button onclick=doAction('talk')>💬 Talk</button><button onclick=doAction('work')>💼 Work</button><button onclick=doAction('study')>📚 Study</button><button onclick=doAction('date')>💖 Date</button><button onclick=doAction('move')>🧭 Explore</button><button onclick=doAction('home')>🏠 Rest</button></div></div><div class=bottom><button onclick=openPanel('life')>Life</button><button onclick=openPanel('world')>World</button><button onclick=openPanel('people')>People</button><button onclick=openPanel('career')>Career</button><button onclick=openPanel('more')>More</button></div></div><div id=modal class="modal hide"><div class=card id=card></div></div><div id=toast class="toast hide"></div><script>const scenes={city:['Starfall City','Explore the capital of your new life.',['#71a9df','#d9b8a0','#43596b'],['🏰','🏙️','🌳']],school:['High School','Classes, friends and your first big choices.',['#a7d8f0','#e8d8c4','#5c8066'],['🏫','📚','🌳']],cafe:['Moonlight Café','Meet friends, work a shift or go on a date.',['#17264d','#b77b69','#3c2935'],['☕','🌙','✨']],beach:['Azure Beach','Swim, relax and make memories.',['#76c8e8','#f6dfaa','#3e9b8d'],['🌴','🌊','☀️']],night:['Night Life','Music, lights and unexpected encounters.',['#11174d','#6a397f','#19152e'],['🎡','🎵','✨']],hospital:['Starlight Hospital','Recover your health and take care of yourself.',['#cde7ef','#eef5f7','#78939b'],['🏥','➕','🌿']],home:['Your House','Sleep, organize your life and spend time with family.',['#809ac7','#d7bfa8','#4f654f'],['🏠','🌳','🚗']],gym:['Fitness Center','Train your body and clear your mind.',['#9bb0c7','#536478','#29394b'],['🏋️','💪','⚡']],garage:['Auto District','Buy a car and customize your lifestyle.',['#647a91','#343e4c','#202831'],['🚗','🔧','🏁']],family:['Family Home','Build relationships and make family memories.',['#8aa9d0','#dfc2a2','#60775f'],['👨‍👩‍👧','🏠','❤️']],pets:['Pet Park','Adopt a companion and care for them.',['#9ed1ed','#e8c99f','#58835d'],['🐕','🐈','🌳']],travel:['World Travel','Choose a destination and start an adventure.',['#5b9fbd','#e8d6b7','#486b61'],['✈️','🗺️','🌎']],estate:['Real Estate','Buy a better home when you can afford it.',['#8399c1','#d7c2a9','#4d6558'],['🏡','🔑','💎']],hobby:['Creative District','Music, art, reading and hobbies.',['#b28acb','#e2c1b3','#4e596d'],['🎨','🎸','📖']],legacy:['Legacy Hall','See the story your choices created.',['#293b68','#b89a72','#273746'],['🏆','📜','⭐']],police:['Police Station','Trouble has consequences.',['#526b8c','#8fa2b6','#303a4a'],['🚓','👮','⚖️']],mall:['Starfall Mall','Shop for clothes, gifts and everyday items.',['#9eafd0','#e4c1c9','#697080'],['🛍️','👗','🍰']]};let S=JSON.parse(localStorage.starlife||'null')||{name:'Avery',age:18,money:2500,health:100,happ:70,edu:'High School',job:'Student',rel:'Single',loc:'city',hair:'#18263c',style:'Hero',personality:'Balanced',pet:false,car:false,married:false,kids:0,wanted:0};let px=48,py=58;const $=id=>document.getElementById(id);function save(){localStorage.starlife=JSON.stringify(S)}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hide');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.add('hide'),1900)}function art(key){let d=scenes[key]||scenes.city;let [a,b,c,icons]=d;return `<svg class=art viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id=g x2=0 y2=1><stop stop-color="${a}"/><stop offset=".62" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><rect width="1000" height="600" fill="url(#g)"/><circle cx="830" cy="100" r="65" fill="#fff4c8" opacity=".75"/><path d="M0 360 Q180 290 350 350 T700 330 T1000 350 V600 H0Z" fill="#24394b" opacity=".55"/><path d="M0 450 Q230 390 500 455 T1000 440 V600 H0Z" fill="#172534" opacity=".8"/><g font-family="sans-serif" text-anchor="middle"><text x="500" y="120" font-size="48" fill="#fff" opacity=".92">${d[0]}</text><text x="500" y="155" font-size="18" fill="#fff" opacity=".8">${d[1]}</text><text x="180" y="330" font-size="120">${icons[0]}</text><text x="500" y="400" font-size="105">${icons[1]}</text><text x="820" y="350" font-size="110">${icons[2]}</text></g><path d="M0 525 Q250 475 500 525 T1000 515" fill="none" stroke="#d9e6ff" stroke-opacity=".2" stroke-width="30"/></svg>`}function sync(){let d=scenes[S.loc]||scenes.city;$('scene').innerHTML=art(S.loc)+'<div class=shade></div>';$('loc').textContent=d[0];$('desc').textContent=d[1];$('age').textContent=S.age;$('money').textContent=Math.max(0,S.money);$('health').textContent=S.health;$('happ').textContent=S.happ;$('hf').style.width=S.health+'%';$('pf').style.width=S.happ+'%';$('edu').textContent=S.edu;$('job').textContent=S.job;$('rel').textContent=S.rel;$('pname').textContent=S.name;$('ph').style.setProperty('--hair',S.hair);save()}function setLoc(x){S.loc=x;px=48;py=58;sync();toast('Travelled to '+(scenes[x]||scenes.city)[0])}function doAction(a){if(a==='talk'){S.happ=Math.min(100,S.happ+5);toast('You had a meaningful conversation.')}if(a==='work'){S.money+=S.job==='Student'?120:300;S.happ=Math.max(0,S.happ-2);toast('Work complete. You earned money.')}if(a==='study'){S.happ=Math.min(100,S.happ+3);if(S.age>=19)S.edu='College';toast('You studied and improved your future.')}if(a==='date'){if(S.rel==='Single')S.rel='Dating';else S.happ=Math.min(100,S.happ+8);toast(S.rel==='Dating'?'Your relationship is growing closer.':'You went on a lovely date.')}if(a==='home'){S.health=Math.min(100,S.health+8);S.happ=Math.min(100,S.happ+3);setLoc('home');return}if(a==='move'){px=25+Math.random()*55;py=40+Math.random()*25;toast('You explored the area.')}sync()}function ageUp(){S.age++;S.happ=Math.max(0,S.happ-3);S.health=Math.max(0,S.health-2);if(S.age>=19&&S.edu==='High School')S.edu='College';if(S.age>=22&&S.job==='Student')S.job='Designer';if(S.age>=80){toast('A lifetime has come to its final chapter.');S.age=18;S.money=2500;S.health=100;S.happ=70;S.job='Student';S.edu='High School';S.rel='Single';S.kids=0;S.married=false;S.loc='city'}sync();toast('A new year begins!')}function openPanel(t){let h='';if(t==='life')h=`<button class=close onclick=closePanel()>✕</button><h2>📖 Your Life</h2><p><b>${S.name}</b>, age ${S.age}. ${S.job}. ${S.edu}.</p><p>❤️ ${S.health} Health · 😊 ${S.happ} Happiness · 💰 $${S.money}</p><p>💞 ${S.rel} · 👶 ${S.kids} children · 🐾 ${S.pet?'Pet':'No pet'} · 🚗 ${S.car?'Car':'No car'}</p><button onclick=ageUp()>🎂 Age Up</button><button onclick=doAction('home')>😴 Rest</button>`;if(t==='world')h=`<button class=close onclick=closePanel()>✕</button><h2>🗺️ Starfall World</h2><div class=grid>${Object.keys(scenes).map(k=>`<button onclick="setLoc('${k}');closePanel()">${scenes[k][0]}</button>`).join('')}</div>`;if(t==='people')h=`<button class=close onclick=closePanel()>✕</button><h2>💞 Relationships</h2><p>🧑 Ren — Friend</p><p>👩 Aiko — ${S.rel}</p><button onclick="doAction('talk');closePanel()">💬 Talk</button><button onclick="S.rel='Dating';sync();toast('You are now dating Aiko!');closePanel()">💖 Ask Out</button><button onclick="S.rel='Married';S.married=true;sync();toast('You got married!');closePanel()">💍 Marriage</button>`;if(t==='career')h=`<button class=close onclick=closePanel()>✕</button><h2>💼 Careers & Education</h2><p>Choose a direction for your future.</p>${['Designer','Developer','Doctor','Artist','Entrepreneur'].map(j=>`<button onclick="S.job='${j}';sync();toast('Career: ${j}');closePanel()">${j}</button>`).join('')}<hr><button onclick="S.edu='College';sync();toast('You enrolled in college.');closePanel()">🎓 Attend College</button>`;if(t==='more')h=`<button class=close onclick=closePanel()>✕</button><h2>✨ More Life</h2><div class=grid><button onclick="S.pet=true;sync();toast('You adopted a pet!');closePanel()">🐾 Adopt Pet</button><button onclick="if(S.money>=1200){S.money-=1200;S.car=true;sync();toast('You bought a car!');closePanel()}else toast('You need $1200.')">🚗 Buy Car</button><button onclick="if(S.money>=5000){S.money-=5000;setLoc('estate');closePanel()}else toast('You need $5000.')">🏡 Buy Home</button><button onclick="S.kids++;sync();toast('Your family grew!');closePanel()">👶 Have Child</button><button onclick="S.health=Math.min(100,S.health+25);setLoc('hospital');sync();closePanel()">🏥 Hospital</button><button onclick="S.happ=Math.min(100,S.happ+10);setLoc('hobby');sync();closePanel()">🎨 Hobby</button><button onclick="setLoc('travel');closePanel()">✈️ Travel</button><button onclick="S.wanted=Math.min(100,S.wanted+30);setLoc('police');sync();toast('The police are looking for you.');closePanel()">🚨 Crime</button><button onclick="S.wanted=0;setLoc('police');sync();toast('Wanted level cleared.');closePanel()">👮 Clear Wanted</button></div>`;$('card').innerHTML=h;$('modal').classList.remove('hide')}function closePanel(){$('modal').classList.add('hide')}function create(){if(localStorage.starlifeCreated)return;let h=`<h2>⭐ Create Your Character</h2><p class=small>Build the person whose life you will play.</p><input class=field id=nm placeholder="Your name" value="Avery"><b>Style</b><div class=choice>${['Hero','Elegant','Sporty'].map(x=>`<button onclick="pick(this,'style','${x}')">${x}</button>`).join('')}</div><b>Hair</b><div class=choice><button onclick="pick(this,'hair','#18263c')">Dark</button><button onclick="pick(this,'hair','#bfc7d8')">Silver</button><button onclick="pick(this,'hair','#4c8cff')">Blue</button></div><b>Personality</b><div class=choice>${['Balanced','Scholar','Social'].map(x=>`<button onclick="pick(this,'personality','${x}')">${x}</button>`).join('')}</div><button onclick="finishCreate()">✨ Start My Life</button>`;$('card').innerHTML=h;$('modal').classList.remove('hide')}let picks={style:'Hero',hair:'#18263c',personality:'Balanced'};function pick(el,k,v){picks[k]=v;[...el.parentNode.children].forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}function finishCreate(){S.name=$('nm').value.trim()||'Avery';Object.assign(S,picks);localStorage.starlifeCreated='1';closePanel();sync();toast('Welcome to StarLife, '+S.name+'!')}function move(dx,dy){px=Math.max(5,Math.min(95,px+dx));py=Math.max(25,Math.min(80,py+dy));$('player').style.left=px+'%';$('player').style.top=py+'%'}document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))move(-2,0);if(['arrowright','d'].includes(k))move(2,0);if(['arrowup','w'].includes(k))move(0,-2);if(['arrowdown','s'].includes(k))move(0,2);if(k===' ')ageUp()});let tx,ty;$('world').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});$('world').addEventListener('touchmove',e=>{if(tx==null)return;let x=e.touches[0].clientX,y=e.touches[0].clientY;move((x-tx)/25,(y-ty)/25);tx=x;ty=y},{passive:true});$('world').addEventListener('touchend',()=>{tx=ty=null});let cmd=document.createElement('input');cmd.className='field';cmd.placeholder='Try: go to school, work, date, travel, buy car, have child';cmd.style.position='absolute';cmd.style.left='12px';cmd.style.right='12px';cmd.style.bottom='15px';cmd.style.width='calc(100% - 24px)';cmd.style.zIndex='4';cmd.style.paddingRight='70px';$('world').appendChild(cmd);cmd.addEventListener('keydown',e=>{if(e.key!=='Enter')return;let q=cmd.value.toLowerCase();cmd.value='';if(q.includes('school'))setLoc('school');else if(q.includes('cafe')||q.includes('coffee'))setLoc('cafe');else if(q.includes('beach'))setLoc('beach');else if(q.includes('hospital'))setLoc('hospital');else if(q.includes('gym'))setLoc('gym');else if(q.includes('home')||q.includes('house'))setLoc('home');else if(q.includes('night'))setLoc('night');else if(q.includes('travel'))setLoc('travel');else if(q.includes('pet')){S.pet=true;sync();toast('You adopted a pet!')}else if(q.includes('car')){S.car=true;S.money=Math.max(0,S.money-1200);sync();toast('You bought a car!')}else if(q.includes('child')){S.kids++;sync();toast('Your family grew!')}else if(q.includes('marry')){S.married=true;S.rel='Married';sync();toast('Congratulations!')}else if(q.includes('work'))doAction('work');else if(q.includes('study'))doAction('study');else if(q.includes('date'))doAction('date');else if(q.includes('talk'))doAction('talk');else if(q.includes('age'))ageUp();else toast('Try a location or life action.')});sync();if(!localStorage.starlifeCreated)create();</script></body></html>
