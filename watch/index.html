<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streamly — Watch Anything</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#f5f5f7;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.top{height:68px;display:flex;align-items:center;gap:24px;padding:0 22px;background:#111116;border-bottom:1px solid #24242b;position:sticky;top:0;z-index:10}.logo{font-weight:900;font-size:23px;letter-spacing:-.7px;white-space:nowrap}.logo span{color:#ff315c}.search{flex:1;max-width:720px;margin:auto;display:flex}.search input{flex:1;background:#08080b;border:1px solid #363640;border-right:0;border-radius:24px 0 0 24px;color:#fff;padding:12px 18px;outline:0}.search button{border:1px solid #363640;background:#24242b;color:white;padding:0 22px;border-radius:0 24px 24px 0;cursor:pointer}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ff315c,#7b5cff);display:grid;place-items:center;font-weight:800}.layout{display:flex}.side{width:220px;padding:18px 12px;position:fixed;top:68px;bottom:0;background:#0d0d12;border-right:1px solid #1f1f25}.side button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#ddd;padding:13px 14px;border-radius:10px;cursor:pointer}.side button:hover,.side button.active{background:#202027;color:#fff}.main{margin-left:220px;padding:26px;max-width:1500px;width:100%}.chips{display:flex;gap:10px;overflow:auto;margin-bottom:25px}.chip{border:0;background:#23232a;color:#eee;padding:9px 15px;border-radius:20px;white-space:nowrap;cursor:pointer}.chip:hover{background:#33333c}.hero{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;margin-bottom:32px}.player{background:#050506;border-radius:16px;overflow:hidden;aspect-ratio:16/9}.player iframe{width:100%;height:100%;border:0}.heroText{padding:15px 8px}.heroText h1{font-size:28px;margin:5px 0 10px}.muted{color:#9c9ca8}.actions{display:flex;gap:10px;margin-top:18px}.actions button{border:0;border-radius:22px;padding:10px 16px;background:#292931;color:#fff;cursor:pointer}.actions .primary{background:#ff315c}.section{margin-top:25px}.section h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.card{cursor:pointer}.thumb{aspect-ratio:16/9;border-radius:11px;overflow:hidden;background:#202027;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.duration{position:absolute;right:7px;bottom:7px;background:#050505dd;padding:3px 6px;border-radius:4px;font-size:12px}.ct{display:flex;gap:10px;margin-top:10px}.miniavatar{width:34px;height:34px;border-radius:50%;background:#30303a;flex:none}.ct h3{font-size:15px;line-height:1.25;margin:0 0 5px}.ct p{font-size:13px;margin:0;color:#9999a4}.creator{padding:18px;border:1px solid #25252d;border-radius:14px;background:#111116}.creator h3{margin:0 0 5px}.creator p{margin:0;color:#9999a4;font-size:13px}.notice{font-size:13px;color:#888;margin-top:20px}@media(max-width:900px){.side{display:none}.main{margin-left:0}.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.top{gap:10px;padding:0 12px}.logo{font-size:19px}}@media(max-width:550px){.grid{grid-template-columns:1fr}.main{padding:15px}.avatar{display:none}}
</style></head>
<body>
<header class="top"><div class="logo">▶ <span>Streamly</span></div><form class="search" id="search"><input id="q" placeholder="Search videos, creators, topics…"><button>⌕</button></form><div class="avatar">S</div></header>
<div class="layout"><aside class="side"><button class="active" onclick="home()">⌂ Home</button><button onclick="showTrending()">🔥 Trending</button><button onclick="showCreators()">★ Creators</button><button onclick="showCategories()">▣ Categories</button><button onclick="openSaved()">♡ Saved</button><hr style="border-color:#222;border-width:1px 0 0;margin:15px 8px"><button onclick="about()">ⓘ About</button></aside>
<main class="main"><div class="chips"><button class="chip" onclick="showCreator('Skiddzie')">Skiddzie</button><button class="chip" onclick="showCreator('Bionic')">Bionic</button><button class="chip" onclick="showCreator('Izzy')">Izzy</button><button class="chip" onclick="showCreator('Doni Bobes')">Doni Bobes</button><button class="chip" onclick="showCreator('Kiply')">Kiply</button><button class="chip" onclick="searchYT('gaming')">Gaming</button><button class="chip" onclick="searchYT('minecraft')">Minecraft</button></div>
<section class="hero"><div class="player"><iframe id="frame" src="https://www.youtube.com/embed/-BaMsw2sEjM?rel=0" title="Video player" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe></div><div class="heroText"><div class="muted">FEATURED</div><h1 id="heroTitle">Skiddzie — Testing the Worst Ideas in Minecraft...</h1><p class="muted">Featured creator video on Streamly.</p><div class="actions"><button onclick="save()">♡ Save</button><button onclick="share()">↗ Share</button></div><p class="notice">Streamly keeps the viewing experience on this page using permitted video embeds. It does not download, copy, or re-host creators' videos.</p></div></section>
<section class="section" id="creatorSection"><h2>Creators on Streamly</h2><div class="grid" id="creators"></div></section>
<section class="section"><h2>Featured creator videos</h2><div class="grid" id="grid"></div></section></main></div>
<script>
const videos=[
['-BaMsw2sEjM','Testing the Worst Ideas in Minecraft...','Skiddzie','Skiddzie'],
['M7lc1UVf-VE','Minecraft creator video','Bionic','Bionic'],
['aqz-KE-bpKQ','Minecraft creator video','Izzy','Izzy'],
['ysz5S6PUM-U','Minecraft creator video','Doni Bobes','Doni Bobes'],
['ScMzIvxBSi4','Minecraft creator video','Kiply','Kiply']
];
const creators=[['Skiddzie','@SkiddziePlays','Skiddzie'],['Bionic','Bionic','Bionic'],['Izzy','Izzy','Izzy'],['Doni Bobes','@DoniBobes','Doni Bobes'],['Kiply','Kiply','Kiply']];
function card(v){return `<div class="card" onclick="play('${v[0]}','${v[1].replaceAll("'","")}','${v[2]}')"><div class="thumb"><img src="https://i.ytimg.com/vi/${v[0]}/hqdefault.jpg"><span class="duration">▶</span></div><div class="ct"><div class="miniavatar"></div><div><h3>${v[1]}</h3><p>${v[2]}</p></div></div></div>`}
function creatorCard(c){return `<div class="creator"><h3>${c[0]}</h3><p>${c[1]}</p><button class="chip" style="margin-top:12px" onclick="showCreator('${c[2]}')">View creator</button></div>`}
function render(list=videos){document.getElementById('grid').innerHTML=list.map(card).join('')}
function renderCreators(){document.getElementById('creators').innerHTML=creators.map(creatorCard).join('')}
function play(id,title,creator){document.getElementById('frame').src='https://www.youtube.com/embed/'+id+'?rel=0';document.getElementById('heroTitle').textContent=title;window.scrollTo({top:0,behavior:'smooth'})}
function showCreator(name){document.getElementById('creatorSection').scrollIntoView({behavior:'smooth'});render(videos.filter(v=>v[2].toLowerCase().includes(name.toLowerCase())));document.getElementById('creatorSection').querySelector('h2').textContent=name+' on Streamly'}
function showCreators(){renderCreators();document.getElementById('creatorSection').scrollIntoView({behavior:'smooth'})}
function searchYT(term){document.getElementById('q').value=term;let list=videos.filter(v=>(v[1]+' '+v[2]+' '+v[3]).toLowerCase().includes(term.toLowerCase()));render(list.length?list:videos)}
document.getElementById('search').onsubmit=e=>{e.preventDefault();let q=document.getElementById('q').value.trim();if(q)searchYT(q)}
function save(){localStorage.setItem('streamlySaved','1');alert('Saved in this browser.')}function openSaved(){alert(localStorage.getItem('streamlySaved')?'You have saved videos.':'No saved videos yet.')}function share(){navigator.clipboard?.writeText(location.href);alert('Streamly link copied.')}function home(){document.getElementById('creatorSection').querySelector('h2').textContent='Creators on Streamly';renderCreators();render(videos)}function showTrending(){render([...videos].reverse())}function showCategories(){render(videos)}function about(){alert('Streamly is a browser video interface for viewing permitted video embeds.')}renderCreators();render();
</script></body></html>
